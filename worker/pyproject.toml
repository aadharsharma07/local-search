[project]
name = "lsworker"
version = "0.1.0"
description = "Text extraction worker for local-search (JSON lines over stdio)"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "pillow>=10",
]

[project.optional-dependencies]
# Cross-platform OCR (ONNX models, no system binary needed).
ocr = ["rapidocr>=3", "onnxruntime>=1.18"]
# Windows built-in OCR (Windows.Media.Ocr) through pywinrt.
windows = [
  "winrt-runtime>=2.3; sys_platform == 'win32'",
  "winrt-Windows.Media.Ocr>=2.3; sys_platform == 'win32'",
  "winrt-Windows.Graphics.Imaging>=2.3; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams>=2.3; sys_platform == 'win32'",
  "winrt-Windows.Globalization>=2.3; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=2.3; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections>=2.3; sys_platform == 'win32'",
]
# Tesseract needs the tesseract binary installed separately.
tesseract = ["pytesseract>=0.3"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
