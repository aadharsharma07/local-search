name: popup build

# Builds the Windows installer for the search popup (ui/), so a visit to the PC only downloads and
# installs it: Actions -> popup build -> latest run -> artifact "local-search-popup-windows".

on:
  workflow_dispatch:
  push:
    paths:
      - "ui/**"
      - ".github/workflows/ui-build.yml"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Rust tests
        run: cd ui/src-tauri && cargo test

      - name: Build the installer
        run: pnpm --filter @local-search/ui tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: local-search-popup-windows
          path: ui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
